; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
; Pause the background PC link (tools/pc_link.py) while uploading, then restart it
extra_scripts = pre:tools/pio_pause_link.py
; The Uno has only 2 KB of RAM. Serial only receives short status lines,
; so shrink its buffers (default 64/64).
build_flags =
    -DSERIAL_RX_BUFFER_SIZE=32
    -DSERIAL_TX_BUFFER_SIZE=16
upload_port = COM5
monitor_port = COM5
lib_deps =
    olikraus/U8g2@^2.35.19
